name: skills-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
      - name: Legal war room contract
        run: bash scripts/test-legal-war-room.sh
      - name: Installer e2e smoke
        run: |
          tmp="$(mktemp -d)"
          HOME="$tmp/home" bash scripts/install-skills-everywhere.sh -A -s "$PWD" -t "$tmp/skills"
          test -f "$tmp/skills/legal-war-room/SKILL.md"
      - name: Claude compressed catalog e2e
        run: |
          tmp="$(mktemp -d)"
          python3 -I scripts/compress-skills.py "$PWD" "$tmp/claude" | tee "$tmp/compress.log"
          python3 - "$PWD" "$tmp/claude" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          ns = runpy.run_path(str(source / "scripts" / "compress-skills.py"))

          def body(path):
              text = path.read_text(encoding="utf-8")
              return ns["split_frontmatter"](text)[1]

          def description(path):
              text = path.read_text(encoding="utf-8")
              front, _ = ns["split_frontmatter"](text)
              return ns["extract_description"](front)[0]

          src = {p.parent.name: p for p in source.glob("*/SKILL.md")}
          dst = {p.parent.name: p for p in target.glob("*/SKILL.md")}
          assert src.keys() == dst.keys(), (len(src), len(dst))
          for name in src:
              assert body(src[name]) == body(dst[name]), f"body changed: {name}"
          before = sum(len(description(p)) for p in src.values())
          after = sum(len(description(p)) for p in dst.values())
          assert after < before, (before, after)
          print(f"verified {len(src)} skills; bodies unchanged; descriptions {before}->{after}")
          PY
          test -f "$tmp/claude/jev-gate/scripts/decide.py"
      - name: Runtime adapter smoke
        run: |
          tmp="$(mktemp -d)"
          python3 -m py_compile scripts/build-runtime-bundles.py
          python3 -I scripts/build-runtime-bundles.py --root "$PWD" --output-dir "$tmp/chatgpt"
          test -s "$tmp/chatgpt/coden607-skills-bundle.md"
          test -s "$tmp/chatgpt/bundle.md"
          test -s "$tmp/chatgpt/PROJECT-INSTRUCTIONS.md"
          python3 - "$PWD" "$tmp/chatgpt/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text())
          expected = sorted(p.parent.name for p in root.glob("*/SKILL.md"))
          actual = sorted(item["path"].split("/", 1)[0] for item in manifest["skills"])
          assert actual == expected, (len(actual), len(expected))
          assert manifest["skill_count"] == len(expected)
          print(f"runtime bundle verified: {len(expected)} skills")
          PY
          HOME="$tmp/home" bash scripts/install-skills-everywhere.sh -A -a -s "$PWD"
          test -f "$tmp/home/.grok/skills/legal-war-room/SKILL.md"
          test -f "$tmp/home/.codex/skills/legal-war-room/SKILL.md"
          grep -q '@xai-official/grok' scripts/one-shot-setup.sh
          grep -q '@xai-official/grok' scripts/install-ai-clis.sh
